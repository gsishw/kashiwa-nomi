
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>柏のみ。｜今夜、どこで飲む？</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f4f0;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#171717;color:white;padding:27px 20px 24px}
.logo{font-size:13px;letter-spacing:3px;color:#d8bd83}
h1{font-size:34px;margin:10px 0}
header p{font-size:13px;color:#ddd;margin:0}
main{max-width:650px;margin:auto;padding:18px 15px}
.intro{font-size:14px;line-height:1.8;margin:0 0 18px}
.panel{background:white;padding:17px;border-radius:15px;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 7px}
select,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:white;font-size:15px}
button{border:0;border-radius:9px;padding:12px;background:#202020;color:white;font-size:14px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters label{margin-top:0}
.wide{grid-column:1/-1}
#count{font-size:13px;color:#666;margin:12px 2px}
.shop{background:white;border-radius:14px;padding:17px;margin-bottom:12px}
.shop-top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.shop h2{font-size:18px;margin:0 0 7px}
.price{font-size:13px;font-weight:bold;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{background:#f0eee8;border-radius:20px;padding:5px 9px;font-size:11px}
.shop p{font-size:13px;line-height:1.7;color:#555}
.actions{display:flex;gap:8px;margin-top:12px}
.actions a{flex:1;text-align:center;text-decoration:none;border:1px solid #222;border-radius:8px;padding:10px;color:#222;font-size:13px}
.actions a:first-child{background:#222;color:white}
.note{font-size:11px;color:#777;line-height:1.7;margin:20px 2px}
footer{text-align:center;padding:24px;font-size:12px;color:#777}
</style>
</head>
<body>
<header>
<div class="logo">KASHIWA NIGHT GUIDE</div>
<h1>柏のみ。</h1>
<p>今夜、どこで飲む？を、すぐ決めよう。</p>
</header>
<main>
<p class="intro">予算・ジャンル・気分から、今夜のお店探し。<br>1軒目も、2軒目も、柏で楽しもう。</p>

<section class="panel">
<strong>今夜のお店を探す</strong>
<div class="filters">
<div>
<label for="budget">予算</label>
<select id="budget">
<option value="all">指定なし</option>
<option value="2000">2,000円以内</option>
<option value="3000">3,000円以内</option>
<option value="5000">5,000円以内</option>
</select>
</div>
<div>
<label for="genre">ジャンル</label>
<select id="genre">
<option value="all">全部</option>
<option value="焼き鳥">焼き鳥</option>
<option value="海鮮">海鮮</option>
<option value="居酒屋">居酒屋</option>
<option value="バー">バー</option>
<option value="ラーメン">ラーメン</option>
</select>
</div>
<div class="wide">
<label for="mood">今の気分</label>
<select id="mood">
<option value="all">なんでもいい！</option>
<option value="ワイワイ">ワイワイ飲みたい</option>
<option value="ゆっくり">ゆっくり話したい</option>
<option value="二軒目">二軒目に行きたい</option>
<option value="ひとり">ひとりで気軽に</option>
</select>
</div>
<div class="wide">
<label for="keyword">店名・キーワード</label>
<input id="keyword" placeholder="例：個室、駅近、安い">
</div>
<div class="wide">
<button id="reset" style="width:100%">条件をリセット</button>
</div>
</div>
</section>

<div id="count"></div>
<div id="results"></div>
<p class="note">※現在はサイトの動作確認用の試作品です。掲載店舗はサンプルで、実在店舗の情報や営業状況を確認したものではありません。お店を実際に掲載する際は、住所・料金・営業時間などを確認して更新します。</p>
</main>
<footer>柏のみ。 © 2026</footer>
<script>
const shops=[
{name:"炭火やきとり（サンプル）",genre:"焼き鳥",price:2500,mood:["ワイワイ","ゆっくり"],tags:["焼き鳥","友達と","居酒屋"],desc:"焼き鳥をつまみながら、気軽に飲みたい夜に。",query:"柏 焼き鳥 居酒屋"},
{name:"海鮮酒場（サンプル）",genre:"海鮮",price:3500,mood:["ワイワイ","ゆっくり"],tags:["海鮮","刺身","日本酒"],desc:"刺身や海鮮料理を楽しみたいときに。",query:"柏 海鮮 居酒屋"},
{name:"気軽な大衆居酒屋（サンプル）",genre:"居酒屋",price:2500,mood:["ワイワイ"],tags:["安め","大人数","にぎやか"],desc:"みんなでワイワイ飲みたい夜の候補。",query:"柏 大衆居酒屋"},
{name:"落ち着くバー（サンプル）",genre:"バー",price:3000,mood:["ゆっくり","二軒目","ひとり"],tags:["バー","二軒目","落ち着く"],desc:"二軒目や、ゆっくり話したいときの候補。",query:"柏 バー"},
{name:"カジュアルバー（サンプル）",genre:"バー",price:2000,mood:["二軒目","ひとり","ワイワイ"],tags:["二軒目","カジュアル","気軽"],desc:"もう少しだけ飲みたいときに。",query:"柏 カジュアルバー"},
{name:"締めのラーメン（サンプル）",genre:"ラーメン",price:1200,mood:["二軒目","ひとり"],tags:["ラーメン","締め","ひとり"],desc:"飲んだあとの締めを探しているときに。",query:"柏 ラーメン"}
];
const results=document.getElementById("results");
function render(){
const budget=document.getElementById("budget").value;
const genre=document.getElementById("genre").value;
const mood=document.getElementById("mood").value;
const keyword=document.getElementById("keyword").value.trim().toLowerCase();
const found=shops.filter(s=>(budget==="all"||s.price<=Number(budget))&&(genre==="all"||s.genre===genre)&&(mood==="all"||s.mood.includes(mood))&&(!keyword||(s.name+s.genre+s.tags.join("")+s.desc).toLowerCase().includes(keyword)));
document.getElementById("count").textContent=found.length+"件のお店候補";
results.innerHTML="";
if(!found.length){results.innerHTML="<section class='panel'>条件に合う候補がないよ。条件を変えてみてね！</section>";return}
found.forEach(s=>{
const el=document.createElement("section");
el.className="shop";
el.innerHTML="<div class='shop-top'><h2></h2><div class='price'></div></div><div class='tags'></div><p></p><div class='actions'><a target='_blank' rel='noopener'>Googleマップで探す</a><a target='_blank' rel='noopener'>お店情報を検索</a></div>";
el.querySelector("h2").textContent=s.name;
el.querySelector(".price").textContent="予算目安 "+s.price.toLocaleString()+"円";
s.tags.forEach(t=>{const span=document.createElement("span");span.className="tag";span.textContent=t;el.querySelector(".tags").appendChild(span)});
el.querySelector("p").textContent=s.desc;
el.querySelectorAll("a")[0].href="https://www.google.com/maps/search/"+encodeURIComponent(s.query);
el.querySelectorAll("a")[1].href="https://www.google.com/search?q="+encodeURIComponent(s.query);
results.appendChild(el);
});
}
["budget","genre","mood"].forEach(id=>document.getElementById(id).addEventListener("change",render));
document.getElementById("keyword").addEventListener("input",render);
document.getElementById("reset").addEventListener("click",()=>{document.getElementById("budget").value="all";document.getElementById("genre").value="all";document.getElementById("mood").value="all";document.getElementById("keyword").value="";render()});
render();
</script>
</body>
</html>
